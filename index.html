<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kentucky EMS Medication Reference - Quick access to statewide EMS protocol medication information">
    <title>Kentucky EMS Medication Reference</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚑 Kentucky EMS Medication Reference</h1>
            <p class="subtitle">Statewide EMS Protocol Medication Guide</p>
        </header>

        <div class="search-section">
            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search medications..."
                    autocomplete="off"
                >
                <button id="clearSearch" class="clear-btn" aria-label="Clear search">✕</button>
            </div>

            <div class="filter-container">
                <label for="categoryFilter">Category:</label>
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="cardiac">Cardiac</option>
                    <option value="respiratory">Respiratory</option>
                    <option value="neurologic">Neurologic</option>
                    <option value="analgesia">Analgesia</option>
                    <option value="sedation">Sedation</option>
                    <option value="antidotes">Antidotes</option>
                    <option value="gi">GI/Antiemetic</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>

        <div id="medicationCount" class="medication-count"></div>

        <div id="medicationList" class="medication-list">
            <!-- Medications will be dynamically loaded here -->
        </div>

        <div id="medicationModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="medicationDetail"></div>
            </div>
        </div>

        <footer>
            <p>For emergency use only. Always follow Kentucky statewide EMS protocols and medical direction.</p>
            <p class="disclaimer">Last updated: January 2026</p>
        </footer>
    </div>

    <script src="medications.js"></script>
    <script src="app.js"></script>
</body>
</html>
