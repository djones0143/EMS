<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jones Family · WDW Field Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152238;
    --ink-soft:#4C5876;
    --ink-faint:#8891A8;
    --paper:#F3EEDF;
    --paper-card:#FFFDF8;
    --paper-deep:#E9E1CC;
    --line: rgba(21,34,56,0.14);
    --gold:#E0993D;
    --gold-soft:#F6E4C2;
    --coral:#D0533D;
    --coral-soft:#F5DAD2;
    --teal:#2E7873;
    --teal-soft:#D7E8E4;
    --plum:#6A4C6E;
    --plum-soft:#E7DCE7;
    --radius: 10px;
    --shadow: 0 1px 0 rgba(21,34,56,0.06), 0 8px 20px -14px rgba(21,34,56,0.35);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(21,34,56,0.05) 1px, transparent 0) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
    line-height:1.5;
    padding-bottom:64px;
  }
  h1,h2,h3,.display{
    font-family:'Big Shoulders Display', system-ui, sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-weight:800;
    color:var(--ink);
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--gold-soft); }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  /* ── Top bar / brand ─────────────────────────────────────────── */
  .topbar{
    padding:14px 16px 10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{
    font-family:'Big Shoulders Display';
    font-weight:800;
    font-size:15px;
    letter-spacing:0.08em;
    background:var(--ink);
    color:var(--paper-card);
    padding:3px 7px 2px;
    border-radius:4px;
  }
  .brand .sub{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono'; letter-spacing:0.02em;}
  .clock{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint); text-align:right; }

  /* ── Day tab nav ──────────────────────────────────────────────── */
  nav.tabs{
    position:sticky; top:0; z-index:40;
    display:flex; gap:6px; overflow-x:auto;
    padding:8px 10px 12px;
    background:linear-gradient(var(--paper) 70%, transparent);
    -ms-overflow-style:none; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .stub{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:8px 12px 7px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-bottom:3px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    min-width:64px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .stub .d{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--ink-faint); }
  .stub .p{ font-family:'Big Shoulders Display'; font-weight:800; font-size:15px; letter-spacing:0.01em; }
  .stub[data-active="true"]{ border-bottom-color:var(--gold); transform:translateY(-2px); }
  .stub[data-active="true"] .p{ color:var(--ink); }
  .stub:not([data-active="true"]){ opacity:0.62; }
  .stub .tempchip{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--ink-soft); margin-top:1px;}

  main{ max-width:640px; margin:0 auto; padding:0 12px; }

  /* ── Trip pass (overview hero) ───────────────────────────────── */
  .pass{
    position:relative;
    background:var(--ink);
    color:var(--paper-card);
    border-radius:14px;
    padding:22px 20px 24px;
    margin:6px 0 18px;
    overflow:hidden;
    box-shadow:0 14px 30px -18px rgba(21,34,56,0.6);
  }
  .pass::before{
    content:"";
    position:absolute; left:0; right:0; bottom:58px;
    border-top:2px dashed rgba(246,228,194,0.35);
  }
  .pass::after{
    content:"";
    position:absolute; left:-10px; bottom:48px; width:20px; height:20px;
    background:var(--paper); border-radius:50%;
    box-shadow: 592px 0 0 var(--paper);
  }
  .pass .eyebrow{ font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.14em; color:var(--gold); margin-bottom:6px;}
  .pass h1{ color:var(--paper-card); font-size:30px; line-height:1.05; }
  .pass .dates{ font-family:'IBM Plex Mono'; color:var(--gold-soft); font-size:13px; margin-top:6px;}
  .pass .party{ margin-top:16px; padding-top:16px; font-size:13.5px; color:rgba(255,253,248,0.86); }
  .pass .party b{ color:var(--paper-card); }
  .pass .tagline{ margin-top:14px; font-size:13px; color:rgba(255,253,248,0.7); font-style:italic; }

  /* ── Weekly outlook strip ────────────────────────────────────── */
  .outlook{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:20px; }
  .outlook button{
    background:var(--paper-card); border:1px solid var(--line); border-radius:9px;
    padding:9px 6px; text-align:left; cursor:pointer;
  }
  .outlook .p{ font-family:'Big Shoulders Display'; font-weight:700; font-size:12.5px;}
  .outlook .t{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:600; margin-top:3px;}
  .outlook .r{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--coral); margin-top:1px;}

  /* ── Section headers ─────────────────────────────────────────── */
  .section-title{
    display:flex; align-items:center; gap:8px;
    font-size:13px; letter-spacing:0.08em; color:var(--ink-soft);
    margin:22px 0 8px; font-family:'IBM Plex Mono'; text-transform:uppercase;
  }
  .section-title .idx{ background:var(--ink); color:var(--paper-card); border-radius:4px; padding:2px 6px; font-size:10.5px; }
  .section-title::after{ content:""; flex:1; border-top:1px solid var(--line); }

  /* ── Legend ───────────────────────────────────────────────────── */
  .legend{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:6px; }
  .legend .item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .legend .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }

  /* ── Conditions board (signature element) ────────────────────── */
  .board{
    background:var(--ink);
    color:var(--paper-card);
    border-radius:12px;
    padding:14px 16px 16px;
    margin-bottom:18px;
    position:relative;
  }
  .board .tag{
    position:absolute; top:-9px; left:14px;
    background:var(--gold); color:var(--ink);
    font-family:'IBM Plex Mono'; font-size:10px; font-weight:600;
    padding:2px 8px; border-radius:4px; letter-spacing:0.06em;
  }
  .board-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px 14px; margin-top:8px;}
  .board-grid .cell .k{ font-family:'IBM Plex Mono'; font-size:9.5px; color:rgba(246,228,194,0.65); letter-spacing:0.08em; text-transform:uppercase;}
  .board-grid .cell .v{ font-family:'IBM Plex Mono'; font-size:16px; font-weight:600; margin-top:2px; color:var(--paper-card);}
  .board-note{ margin-top:12px; padding-top:10px; border-top:1px dashed rgba(246,228,194,0.25); font-size:12.5px; color:rgba(255,253,248,0.82); line-height:1.5;}
  .board-note b{ color:var(--gold-soft); }

  /* ── Timeline ─────────────────────────────────────────────────── */
  .timeline{ position:relative; padding-left:20px; margin-bottom:8px; }
  .timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .tl-item{ position:relative; margin-bottom:10px; }
  .tl-item::before{
    content:""; position:absolute; left:-20px; top:14px; width:9px; height:9px;
    border-radius:50%; background:var(--paper-card); border:2px solid var(--ink-faint);
  }
  .tl-item[data-tag="weather"]::before{ border-color:var(--gold); }
  .tl-item[data-tag="storm"]::before{ border-color:var(--coral); }
  .tl-item[data-tag="levi"]::before{ border-color:var(--teal); }
  .tl-item[data-tag="show"]::before{ border-color:var(--plum); }

  details.card{
    background:var(--paper-card); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow);
  }
  details.card summary{
    list-style:none; cursor:pointer; padding:10px 12px;
    display:flex; align-items:flex-start; gap:10px;
  }
  details.card summary::-webkit-details-marker{ display:none; }
  .tl-time{ font-family:'IBM Plex Mono'; font-size:12px; font-weight:600; color:var(--ink-soft); flex:0 0 auto; padding-top:1px; min-width:46px;}
  .tl-body{ flex:1; min-width:0; }
  .tl-title{ font-size:14px; font-weight:700; color:var(--ink); }
  .tl-tags{ display:flex; gap:5px; margin-top:5px; flex-wrap:wrap; }
  .chip{
    font-family:'IBM Plex Mono'; font-size:9.5px; letter-spacing:0.03em;
    padding:2px 6px; border-radius:4px; font-weight:600; white-space:nowrap;
  }
  .chip.weather{ background:var(--gold-soft); color:#8A5A16; }
  .chip.storm{ background:var(--coral-soft); color:#8C3423; }
  .chip.levi{ background:var(--teal-soft); color:#1D4E4A; }
  .chip.show{ background:var(--plum-soft); color:#4A354D; }
  .chip.meal{ background:var(--paper-deep); color:var(--ink-soft); }
  .chip.break{ background:var(--ink); color:var(--paper-card); }
  .chevron{ flex:0 0 auto; color:var(--ink-faint); transition:transform .18s ease; margin-top:2px;}
  details[open] .chevron{ transform:rotate(90deg); }
  .tl-detail{ padding:0 14px 14px 68px; font-size:13px; color:var(--ink-soft); line-height:1.55; }
  .tl-detail b{ color:var(--ink); }

  /* ── Accordion (reference sections) ──────────────────────────── */
  details.folder{
    background:var(--paper-card); border:1px solid var(--line); border-radius:10px;
    margin-bottom:8px; box-shadow:var(--shadow);
  }
  details.folder > summary{
    list-style:none; cursor:pointer; padding:11px 13px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-family:'Big Shoulders Display'; font-weight:700; font-size:14px; letter-spacing:0.02em;
  }
  details.folder > summary::-webkit-details-marker{ display:none; }
  details.folder .inner{ padding:0 14px 14px; font-size:13px; color:var(--ink-soft); }
  details.folder .inner p{ margin:0 0 8px; }
  details.folder .inner ul{ margin:0 0 4px; padding-left:18px; }
  details.folder .inner li{ margin-bottom:6px; }
  details.folder .inner li b{ color:var(--ink); }

  .row-card{
    border-top:1px solid var(--line); padding:9px 0; font-size:13px;
  }
  .row-card:first-child{ border-top:none; padding-top:2px; }
  .row-card .k{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em;}
  .row-card .v{ margin-top:2px; color:var(--ink-soft); line-height:1.5;}
  .row-card .v b{ color:var(--ink); }

  /* ── Ride priority pills ─────────────────────────────────────── */
  .pill-list{ display:flex; flex-direction:column; gap:6px; }
  .pill{
    display:flex; gap:8px; align-items:flex-start;
    background:var(--paper); border-radius:8px; padding:8px 10px; font-size:12.5px; color:var(--ink-soft);
  }
  .pill .num{ font-family:'IBM Plex Mono'; font-weight:700; color:var(--ink-faint); }
  .pill b{ color:var(--ink); }

  /* ── Buttons / misc ──────────────────────────────────────────── */
  .btn-reset{
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft);
    background:none; border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer;
  }
  .btn-reset:hover{ border-color:var(--ink-faint); }

  /* ── Packing checklist ───────────────────────────────────────── */
  .pack-cat{ margin-bottom:14px; }
  .pack-cat h3{ font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:0.03em; margin-bottom:6px; }
  .pack-item{
    display:flex; align-items:flex-start; gap:10px; padding:8px 4px;
    border-bottom:1px solid var(--line); cursor:pointer; user-select:none;
  }
  .pack-item:last-child{ border-bottom:none; }
  .pack-item .box{
    flex:0 0 auto; width:19px; height:19px; border-radius:5px; margin-top:1px;
    border:2px solid var(--ink-faint); display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .pack-item.checked .box{ background:var(--teal); border-color:var(--teal); transform:scale(1.05); }
  .pack-item .box svg{ opacity:0; transform:scale(0.5); transition:opacity .12s ease, transform .12s ease; }
  .pack-item.checked .box svg{ opacity:1; transform:scale(1); }
  .pack-item .label{ font-size:13.5px; color:var(--ink-soft); line-height:1.4; }
  .pack-item.checked .label{ color:var(--ink-faint); text-decoration:line-through; }
  .pack-progress{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-soft);
  }
  .bar{ flex:1; height:6px; background:var(--paper-deep); border-radius:3px; margin:0 10px; overflow:hidden;}
  .bar > i{ display:block; height:100%; background:var(--teal); transition:width .3s ease; }

  /* height chart */
  .hgrid{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
  .hrow{ display:flex; gap:10px; align-items:flex-start; background:var(--paper); border-radius:8px; padding:8px 10px; }
  .hrow .h{ font-family:'IBM Plex Mono'; font-weight:700; font-size:13px; color:var(--ink); min-width:34px; }
  .hrow.clear .h{ color:var(--teal); }
  .hrow .r{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

  footer{ text-align:center; padding:26px 20px 10px; color:var(--ink-faint); font-size:11.5px; font-family:'IBM Plex Mono'; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>

let checkedSet = new Set();
async function loadChecked(){
  try{
    const res = await window.storage.get('packing-checked', false);
    if(res && res.value){ checkedSet = new Set(JSON.parse(res.value)); }
  }catch(e){ /* no saved state yet */ }
}
async function saveChecked(){
  try{ await window.storage.set('packing-checked', JSON.stringify([...checkedSet]), false); }
  catch(e){ console.error('storage error', e); }
}

let active = 'overview';

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const items = [{key:'overview', label:'TRIP', short:'ALL'}, ...DAYS.map(d=>({key:d.key,label:d.short,day:d})),
                 {key:'characters', label:'CAST', short:'★'}, {key:'prep', label:'PREP', short:'✓'}];
  tabs.innerHTML = items.map(it=>{
    const day = it.day;
    const temp = day ? `${day.high}°` : '';
    const dateShort = day ? day.date.split(' ')[0]+' '+day.date.split(' ')[2] : (it.key==='overview'?'Aug 18–21':'—');
    return `<div class="stub" data-key="${it.key}" data-active="${active===it.key}">
      <span class="d">${dateShort}</span>
      <span class="p">${it.label}</span>
      ${day?`<span class="tempchip">${temp} · ${day.rain}%</span>`:''}
    </div>`;
  }).join('');
  tabs.querySelectorAll('.stub').forEach(el=>{
    el.addEventListener('click', ()=>{ active = el.dataset.key; location.hash = active; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); });
  });
}

function chip(tag){
  const labels = {weather:'WEATHER PRIORITY', storm:'STORM', levi:'LEVI OPTION', show:'SHOW / CHARACTER', meal:'MEAL', break:'BREAK', logistics:'LOGISTICS'};
  if(!labels[tag]) return '';
  const cls = ['weather','storm','levi','show','meal','break'].includes(tag) ? tag : '';
  return `<span class="chip ${cls}">${labels[tag]}</span>`;
}

        <ul>
          <li><b>Early Entry.</b> Already paid for if onsite — 30 minutes before the public is worth more than any paid skip.</li>
          <li><b>Rider Switch.</b> One adult rides, one waits with Levi, then swap without re-queuing. Elijah can ride again on the swap too. Everyone still needs their own reservation if you ever do buy passes — Rider Switch doesn't cover the group.</li>
          <li><b>The hour after a storm.</b> Waits fall by a third or more. Three of four days have a storm forecast, which means three built-in windows that behave like a free Lightning Lane.</li>
          <li><b>The last 90 minutes before close.</b> Families with small kids have gone home. Catch whatever got away earlier.</li>
        </ul>
        <p><b>The 40-minute rule:</b> if a posted wait is over 40 minutes, walk away. Something else nearby is almost always under 20.</p>
      </div>
    </details>

    <div class="section-title"><span class="idx">04</span>Levi at 36 inches</div>
    <details class="folder">
      <summary><span>What he clears, what he doesn't</span>${ICON.chev}</summary>
      <div class="inner">
        <p><b>Clears:</b> The Barnstormer (35") and Alien Swirling Saucers (32") — his first real coaster is Thursday morning.</p>
        <p><b>Misses by 2":</b> Seven Dwarfs Mine Train, Slinky Dog Dash, Kali River Rapids (all 38"). Not borderline — Rider Switch, don't hope.</p>
        <p><b>Disney measures with shoes on.</b> Sneakers, not sandals, especially Thursday.</p>
        <p>Full height chart is in the Prep tab.</p>
      </div>
    </details>
  `;
  el.querySelectorAll('[data-jump]').forEach(b=>{
    b.addEventListener('click', ()=>{ active=b.dataset.jump; location.hash=active; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); });
  });
  return el;
}

function renderDay(day){
  const el = document.createElement('div');
  el.className = 'fade-in';
  el.innerHTML = `
    <div class="section-title" style="margin-top:14px;"><span class="idx">${day.short}</span>${day.park} — ${day.date}</div>

    <div class="board">
      <span class="tag">CONDITIONS</span>
      <div class="board-grid">
        <div class="cell"><div class="k">High</div><div class="v">${day.high}°F</div></div>
        <div class="cell"><div class="k">Rain chance</div><div class="v">${day.rain}%</div></div>
        <div class="cell"><div class="k">Gates</div><div class="v" style="font-size:12.5px;">${day.gates}</div></div>
        <div class="cell"><div class="k">Evening</div><div class="v" style="font-size:12.5px;">${day.closeShow}</div></div>
      </div>
      <div class="board-note"><b>Storm timing:</b> ${day.stormNote}. ${day.eveningNote}.<br><br>${day.boardNote}</div>
    </div>

    <div class="section-title"><span class="idx">RUN</span>Timeline</div>
    <div class="timeline">
      ${day.timeline.map(it=>`
        <div class="tl-item" data-tag="${it.tag}">
          <details class="card">
            <summary>
              <span class="tl-time mono">${it.t}</span>
              <span class="tl-body">
                <span class="tl-title">${it.title}</span>
                <span class="tl-tags">${chip(it.tag)}</span>
              </span>
              <span class="chevron">${ICON.chev}</span>
            </summary>
            <div class="tl-detail">${it.d}</div>
          </details>
        </div>
      `).join('')}
    </div>

    <div class="section-title"><span class="idx">REF</span>Ride priorities</div>
    <details class="folder">
      <summary><span>Amelia & Elijah's list</span>${ICON.chev}</summary>
      <div class="inner"><div class="pill-list">
        ${day.rideBig.map((r,i)=>`<div class="pill"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${r}</span></div>`).join('')}
      </div></div>
    </details>
    <details class="folder">
      <summary><span>Levi's list</span>${ICON.chev}</summary>
      <div class="inner"><div class="pill-list">
        ${day.rideLevi.map((r,i)=>`<div class="pill"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${r}</span></div>`).join('')}
      </div></div>
    </details>

    <details class="folder">
      <summary><span>Split points — Levi while they ride</span>${ICON.chev}</summary>
      <div class="inner">
        ${day.leviSplit.map(s=>`
          <div class="row-card">
            <div class="k">${s.when} · while they do: ${s.big}</div>
            <div class="v">${s.levi}</div>
          </div>
        `).join('')}
      </div>
    </details>

    <details class="folder">
      <summary><span>Dining</span>${ICON.chev}</summary>
      <div class="inner">
        ${day.dining.map(m=>`
          <div class="row-card">
            <div class="k">${m.meal} · ${m.price}</div>
            <div class="v"><b>${m.place}</b> — ${m.note}</div>
          </div>
        `).join('')}
      </div>
    </details>

    <details class="folder">
      <summary><span>Evening show detail</span>${ICON.chev}</summary>
      <div class="inner">
        <p><b>${day.show.name}</b> — ${day.show.loc}</p>
        <p>${day.show.detail}</p>
        <p style="color:var(--coral);">${day.show.risk}</p>
      </div>
    </details>

    <details class="folder">
      <summary><span>If the storm hits — indoor backup</span>${ICON.chev}</summary>
      <div class="inner"><ul>
        ${day.indoor.map(x=>`<li>${x}</li>`).join('')}
      </ul></div>
    </details>
  `;
  return el;
}

function renderCharacters(){
  const el = document.createElement('div');
  el.className = 'fade-in';
  el.innerHTML = `
    <div class="section-title" style="margin-top:14px;"><span class="idx">★</span>Character plan</div>
    <p style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">Not "collect six characters today." It's "while the big kids ride, what's the best thing within 100 yards?" Sometimes that's a character. Often a show beats a line. <b>20-minute ceiling</b> — if the posted wait is over 20, walk away.</p>

    <div class="section-title"><span class="idx">01</span>Levi's favorites</div>
    ${CHAR_LEVI.map(c=>`
      <div class="row-card">
        <div class="k">${c.who}</div>
        <div class="v"><b>${c.where}</b><br>${c.note}</div>
      </div>
    `).join('')}

    <div class="section-title"><span class="idx">02</span>Free wins</div>
    <div class="pill-list">
      ${CHAR_FREE.map((f,i)=>`<div class="pill"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${f}</span></div>`).join('')}

    <div class="section-title"><span class="idx">03</span>Amelia's three</div>
    <p style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">Rapunzel, Merida, Belle — no princesses beyond these three, by request.</p>
    ${CHAR_AMELIA.map(c=>`
      <div class="row-card">
        <div class="k">${c.who}</div>
        <div class="v"><b>${c.where}</b><br>${c.note}</div>
      </div>
    `).join('')}
    <details class="folder" style="margin-top:10px;">
      <summary><span>See all three at once, free</span>${ICON.chev}</summary>
      <div class="inner">
        <p>Festival of Fantasy Parade, Thursday ~3 PM, features Belle, Rapunzel and Merida together — plus Mickey and friends for Levi. One curb, zero queue, all five of you served at once.</p>
        <p>If it satisfies Amelia, you've saved 90 minutes of princess lines. May run as a smaller Rainy Day Cavalcade if wet.</p>
      </div>

function renderPrep(){
  const el = document.createElement('div');
  el.className = 'fade-in';
  el.innerHTML = `
    <div class="section-title" style="margin-top:14px;"><span class="idx">✓</span>Height chart</div>
    <div class="hgrid">
      ${HEIGHTS.map(h=>`<div class="hrow ${h.clear?'clear':''}"><span class="h">${h.h}</span><span class="r">${h.r}</span></div>`).join('')}
    </div>
    <p style="font-size:11.5px; color:var(--ink-faint); margin:6px 0 20px;">Green rows = Levi clears at 36". Everything else is Rider Switch.</p>

    <div class="section-title"><span class="idx">✓</span>Packing checklist</div>
    <div class="pack-progress">
      <span id="pack-count">0 / 0 packed</span>
      <div class="bar"><i id="pack-bar" style="width:0%"></i></div>
      <button class="btn-reset" id="pack-reset">RESET</button>
    </div>
    <div id="pack-root"></div>

    <div class="section-title" style="margin-top:24px;"><span class="idx">✓</span>Storm playbook</div>
    <details class="folder">
      <summary><span>Same moves every day</span>${ICON.chev}</summary>
      <div class="inner">
        <ul>
          <li>Check radar at 7 AM and again at 2 PM. Florida storms are fast and local — it can pour on one land while the next stays dry.</li>
          <li>When you hear thunder, head for an indoor attraction, not the exit. Half the park leaves and waits collapse afterward.</li>
          <li>The hour after a storm is the best touring window of the day.</li>
          <li>Ponchos, not umbrellas — miserable in crowds, useless in wind.</li>
        </ul>
      </div>
    </details>
  `;

  const packRoot = el.querySelector('#pack-root');
  packRoot.innerHTML = PACK.map(cat=>`
    <div class="pack-cat">
      <h3>${cat.cat}</h3>
      ${cat.items.map(it=>`
        <div class="pack-item ${checkedSet.has(it.id)?'checked':''}" data-id="${it.id}">
          <span class="box">${ICON.check}</span>
          <span class="label">${it.label}</span>
        </div>
      `).join('')}
    </div>
  `).join('');

  function updateProgress(){
    const total = PACK.reduce((n,c)=>n+c.items.length,0);
    const done = checkedSet.size;
    el.querySelector('#pack-count').textContent = `${done} / ${total} packed`;
    el.querySelector('#pack-bar').style.width = `${total?Math.round(done/total*100):0}%`;
  }
  updateProgress();

  packRoot.querySelectorAll('.pack-item').forEach(item=>{
    item.addEventListener('click', async ()=>{
      const id = item.dataset.id;
      if(checkedSet.has(id)){ checkedSet.delete(id); } else { checkedSet.add(id); }
      item.classList.toggle('checked');
      updateProgress();
      await saveChecked();
    });
  });

  el.querySelector('#pack-reset').addEventListener('click', async ()=>{
    checkedSet.clear();
    packRoot.querySelectorAll('.pack-item').forEach(i=>i.classList.remove('checked'));
    updateProgress();
    await saveChecked();
  });

  return el;
}

function renderAll(){
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML = '';
  let node;
  if(active==='overview') node = renderOverview();
  else if(active==='characters') node = renderCharacters();
  else if(active==='prep') node = renderPrep();
  else {
    const day = DAYS.find(d=>d.key===active);
    node = day ? renderDay(day) : renderOverview();
  }
  main.appendChild(node);
}

/* init */
(async function init(){
  const h = location.hash.replace('#','');
  if(h && (h==='overview'||h==='characters'||h==='prep'||DAYS.some(d=>d.key===h))) active = h;
  await loadChecked();
  renderAll();
})();
window.addEventListener('hashchange', ()=>{
  const h = location.hash.replace('#','');
  if(h){ active = h; renderAll(); }
});
</script>
</body>
</html>
